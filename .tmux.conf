# ============= Tmux Configuration =============
set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "tmux-256color"

set -g mouse on
set -sg escape-time 0

# Allow tmux clipboard to copy to system clipboard
set -s set-clipboard on

bind r source-file ~/.tmux.conf

# ============= Prefix =============
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# ============= Key Bindings =============

bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# bind-key -T copy-mode-vi v send -X begin-selection
# bind-key -T copy-mode-vi V send -X select-line
# bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'

# unbind old split window bindings
unbind %
unbind '"'

bind _ split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# ============= Window and Pane indexing =============

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g renumber-windows on

# ============= Status Bar =============

set -g status on
set -g status-bg "black"
set -g status-fg "#dcd7ba" # kanagawa-wave text color

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left "#S   "
set -g status-right ""

set -g window-status-format "  #I #{pane_current_command}  "
set -g window-status-current-format "#[bg=#333333][  #I #{pane_current_command}  ]"

# ============= FZF URL Picker =============

bind-key C-u run-shell -b "tmux capture-pane -J -p | grep -oE '(https?):\/\/.*[^>]' | fzf-tmux -d20 --multi --bind alt-a:select-all,alt-d:deselect-all | xargs open"

# ============= FZF Session Switcher =============

# bind f display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

# ============= Tmux Sessionizer =============

bind f run-shell "tmux neww ~/tmux-sessionizer.sh"
bind h run-shell "tmux neww ~/tmux-sessionizer.sh ~"

# ============= OPEN GH Repo =============

bind g run-shell "~/projects/personal/dotfiles/scripts/open-repo.sh"
